worker_processes 1;
pid .run/uyasoo-microblog-nginx.pid;
error_log .run/uyasoo-microblog-nginx-error.log;

events {
    worker_connections 256;
}

http {
    include nginx/mime.types;
    default_type application/octet-stream;
    access_log .run/uyasoo-microblog-nginx-access.log;

    server {
        listen 127.0.0.1:18081;
        server_name localhost;
        root .;
        index default.asp;
        client_max_body_size 6m;

        location ~ ^/(?:config|lib|upload-utils)\.asp$ {
            return 404;
        }

        location ^~ /tests/ {
            return 404;
        }

        location ^~ /assets/uploads/ {
            return 404;
        }

        location / {
            try_files $uri $uri/ /default.asp?$query_string;
        }

        location ~ \.asp$ {
            try_files $uri =404;
            include nginx/fastcgi_params;

            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $document_root;
            fastcgi_param PATH_INFO "";
            fastcgi_param PATH_TRANSLATED $document_root$fastcgi_script_name;

            fastcgi_pass 127.0.0.1:19000;
            fastcgi_read_timeout 30s;
        }
    }
}
